/* =========================================================
   GLOBAL RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    scroll-padding-top: 85px;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    line-height: 1.7;
    background: #f7f8f6;
    color: #1e2823;
    overflow-x: hidden;
}

a {
    text-decoration: none;
}

button,
input,
select,
textarea {
    font-family: inherit;
}

img {
    max-width: 100%;
    display: block;
}


/* =========================================================
   COLORS
========================================================= */

:root {

    --green-dark: #063b2a;

    --green: #0b5a40;

    --green-light: #eaf3ee;

    --gold: #c79a21;

    --gold-light: #e9c866;

    --white: #ffffff;

    --text: #1e2823;

    --muted: #68736d;

    --light-bg: #f7f8f6;

    --border: #e2e8e3;

    --shadow:
        0 15px 45px rgba(0,0,0,0.08);

}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes fadeUp {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* =========================================================
   TOP BAR
========================================================= */

.top-bar {

    background:
        linear-gradient(
            90deg,
            var(--green-dark),
            #084b35
        );

    color: white;

    padding:
        9px
        5%;

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: 13px;

}

.top-bar span {
    opacity: 0.9;
}

.top-bar a {
    color: white;
}


/* =========================================================
   NAVIGATION
========================================================= */

nav {

    position: sticky;

    top: 0;

    z-index: 9999;

    background:
        rgba(255,255,255,0.97);

        blur(12px);

    border-bottom:

}

    padding:

    justify-content: space-between;

    align-items: center;

}

.nav-logo img {

    width: 52px;

}

    font-size: 16px;

    line-height: 1.2;

.nav-logo-text span {

    font-size: 10px;

}

    display: flex;

    align-items: center;

    gap: 25px;

}

.nav-links a {

    color: var(--green-dark);

    font-size: 14px;

    font-weight: bold;

}

.nav-links a:hover {

        var(--green-dark);

}

.nav-cta:hover {

    background:

}

========================================================= */

    cursor: pointer;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 5px;

}

.menu-toggle span {

    width: 24px;

    height: 2px;

    background: var(--green-dark);

    border-radius: 3px;

    transition: 0.3s ease;

}

.menu-toggle.active span:nth-child(1) {

    transform:

}

.menu-toggle.active span:nth-child(2) {

    opacity: 0;

}

.menu-toggle.active span:nth-child(3) {

        translateY(-7px)

}
